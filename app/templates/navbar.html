
<header class="navbar">
    <a href="/dashboard" class="navbar-brand">
        <span class="navbar-logo">RS</span>
        <span>RoomSync</span>
    </a>

    {% if current_user.is_authenticated %}
    <nav class="navbar-links">
        <a href="/dashboard" class="navbar-link">House</a>
        <a href="#" class="navbar-link">Calendar</a>
    </nav>

    <div class="navbar-user">
        <span>{{ current_user.username }}</span>

        <!-- Secure logout using POST and CSRF -->
        <form method="POST"
              action="{{ url_for('auth.logout') }}"
              class="logout-form">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <button type="submit" class="navbar-signout">
                Sign out
            </button>
        </form>
    </div>
    {% endif %}
</header>
